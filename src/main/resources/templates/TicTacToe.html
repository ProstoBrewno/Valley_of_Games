<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Крестики-нолики</title>
    <link rel="stylesheet" th:href="@{/css/TicTacToe.css}">
</head>
<body>
<div class="game-container">
    <h1>Крестики-нолики</h1>

    <div class="score-board">
        <div class="score">
            <div>Вы (X)</div>
            <div class="score-value" id="player-score">0</div>
        </div>
        <div class="score">
            <div>Ничьи</div>
            <div class="score-value" id="draw-score">0</div>
        </div>
        <div class="score">
            <div>Компьютер (O)</div>
            <div class="score-value" id="computer-score">0</div>
        </div>
    </div>

    <div class="game-board" id="board"></div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button id="start-btn">Новая игра</button>
        <a th:href="@{/}" class="back-btn">Назад</a>
    </div>
</div>

<script th:src="@{/js/TicTacToe.js}"></script>
</body>
</html>
